name: ohmydocagent-local

services:
  postgres:
    image: paradedb/paradedb:v0.22.2-pg17
    environment:
      POSTGRES_DB: ohmydocagent
      POSTGRES_USER: ohmydocagent
      POSTGRES_PASSWORD: ohmydocagent
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - "postgres-data:/var/lib/postgresql/data"
      - "./initdb/init.sql:/docker-entrypoint-initdb.d/init.sql:ro"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ohmydocagent
      MINIO_ROOT_PASSWORD: ohmydocagent-local-secret
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["minio-data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  neo4j:
    image: neo4j:2025.10.1
    environment:
      NEO4J_AUTH: neo4j/ohmydocagent-local-secret
    ports: ["127.0.0.1:7474:7474", "127.0.0.1:7687:7687"]
    volumes: ["neo4j-data:/data", "neo4j-logs:/logs"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:7474 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
volumes:
  postgres-data:
  redis-data:
  minio-data:
  neo4j-data:
  neo4j-logs:
