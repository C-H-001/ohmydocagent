# OhMyDocAgent 前端 nginx 配置：静态资源 + /api 反代后端 + SSE 支持
server {
    listen 80;
    server_name _;
    # 评测/真实文档上传：MMLongBench 单个 PDF 可达几十 MB
    client_max_body_size 100m;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # 前端路由（React Router 的 SPA fallback）
    location / {
        try_files $uri $uri/ /index.html;
        # index.html 不缓存（每次发版引用新 hash 资源，避免旧入口缓存）
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }

    # 带 hash 的资源文件长缓存（内容不可变，文件名即版本）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # pdf.js worker 是 .mjs（module worker）——必须 JS MIME，否则浏览器拒绝加载
    location ~* \.mjs$ {
        default_type application/javascript;
    }

    # 后端 API 反代
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 必需：禁用缓冲，否则流式事件被 nginx 缓存后无法实时到达
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_read_timeout 300s;
    }
}
